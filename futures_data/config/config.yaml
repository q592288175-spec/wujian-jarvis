# 请求间隔不是供应商端到端延迟；全市场轮询周期至少分钟级。
db_path: .runtime/akshare/futures.sqlite
poll_minutes: 1
request_interval_seconds: 0.75
request_timeout_seconds: 12
call_timeout_seconds: 35
retries: 2
spot_lookback_days: 7
daily_hour: 17
daily_minute: 30
timezone: Asia/Shanghai
phase2_enabled: true
# 冷门品种暂不纳入：fb 纤维板、bb 胶合板、rr 粳米、wh 强麦、pm 普麦。
